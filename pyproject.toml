[project]
name = "patchwright"
version = "0.1.0"
description = "A bug-fixing agent that only ships fixes it can prove, built on NVIDIA Nemotron via Nebius Token Factory."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "openai>=1.40",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["patchwright"]
